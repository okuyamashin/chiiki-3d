<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地形3Dビュー</title>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<style>
  :root { --bg:#0e1116; --panel:rgba(20,24,31,.9); --fg:#e8eaee; --muted:#9aa3b0; --line:#2b323d; --accent:#ffb347; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; top:16px; left:16px; width:320px; max-width:calc(100% - 32px); box-sizing:border-box;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; backdrop-filter:blur(6px); }
  h1 { font-size:16px; margin:0 0 2px; font-weight:600; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .row { margin:12px 0 4px; }
  .label { font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  label.cb { font-size:12.5px; display:flex; gap:6px; align-items:center; margin:4px 0; cursor:pointer; }
  .key { margin-left:auto; font-size:10.5px; white-space:nowrap; color:var(--muted); display:flex; gap:3px; align-items:center; }
  .key i { display:inline-block; width:12px; height:3px; border-radius:2px; margin-left:4px; }
  .key i.rail { height:4px; background:repeating-linear-gradient(90deg,#222 0 3px,#fff 3px 6px); border:1px solid #222; }
  .legend { display:flex; gap:2px; margin:2px 0 8px 22px; font-size:10.5px; color:var(--muted); }
  .legend span { flex:1; text-align:center; }
  .legend span i { display:block; height:8px; border-radius:2px; margin-bottom:2px; }
  #charts { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .pyr { position:absolute; transform:translate(-50%, 0); background:rgba(14,17,22,.72); border-radius:6px; padding:3px 4px 2px; }
  .pyr svg { display:block; }
  .panel { transition:opacity .4s; }
  .panel { max-height:calc(100% - 110px); overflow-y:auto; }
  .panel.dim { opacity:0; pointer-events:none; }
  #tour { position:absolute; left:16px; bottom:16px; display:flex; gap:6px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; backdrop-filter:blur(6px); }
  #tour button { width:38px; height:34px; border-radius:8px; border:1px solid var(--line); background:#1d232c; color:var(--fg);
    font-size:15px; cursor:pointer; }
  #tour button#tPlay { width:52px; background:var(--accent); color:#1a1408; border-color:var(--accent); font-weight:700; }
  #tour button:hover { filter:brightness(1.15); }
  #tPos { font-size:12px; color:var(--muted); min-width:64px; margin-left:4px; white-space:nowrap; }
  #caption { position:absolute; left:310px; right:16px; bottom:16px; max-width:680px;
    background:rgba(14,17,22,.88); border:1px solid var(--line); border-radius:12px; padding:12px 16px; backdrop-filter:blur(6px); }
  .cap-head { display:flex; gap:8px; align-items:baseline; margin-bottom:6px; }
  #capPart { font-size:11px; color:#1a1408; background:var(--accent); border-radius:4px; padding:1px 6px; }
  #capTitle { font-size:15px; font-weight:600; }
  #capText { font-size:13.5px; line-height:1.75; color:#c9ced6; }
  #capText .now { color:#fff; background:rgba(255,179,71,.18); border-radius:3px; }
  body.editorial #caption { left:50%; right:auto; bottom:70px; transform:translateX(-50%); width:max-content; max-width:calc(100% - 48px); text-align:center; }
  body.editorial #capText { font-size:14px; }
  body.editorial #capTitle { font-size:21px; }
  #sceneCard { position:absolute; top:16px; right:16px; width:320px; max-width:calc(100% - 32px); box-sizing:border-box;
    background:rgba(14,17,22,.93); border:1px solid var(--line); border-radius:12px; padding:14px 16px; line-height:1.7; }
  #sceneCard h2 { margin:0 0 8px; font-size:17px; }
  #sceneCard p { margin:5px 0; font-size:14px; }
  #sceneCard small { display:block; margin-top:8px; color:var(--muted); font-size:10px; }
  #sceneCard[hidden] { display:none; }
  body.intro #sceneCard { display:none; }
  body.render.editorial #caption { bottom:22px; }
  @media (max-width:900px) { #caption { left:16px; right:16px; bottom:72px; } }
  #chart { position:absolute; top:16px; right:16px; width:360px; max-width:calc(100% - 32px); box-sizing:border-box;
    background:rgba(14,17,22,.9); border:1px solid var(--line); border-radius:12px; padding:12px 14px 10px; backdrop-filter:blur(6px); }
  #chart h2 { font-size:13.5px; margin:0 0 2px; font-weight:600; }
  #chart .csub { font-size:11px; color:var(--muted); margin-bottom:8px; }
  #chart svg { display:block; width:100%; height:auto; overflow:visible; }
  #chart svg text { font-family:inherit; }
  #chart .lg { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:10.5px; color:var(--muted); margin-top:6px; }
  #chart .lg i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
  #chart .cnote { font-size:10.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  @media (max-width:900px) { #chart { top:auto; bottom:190px; width:auto; left:16px; } }
  #telop { position:absolute; left:0; right:0; bottom:18%; text-align:center; pointer-events:none; opacity:0; }
  #telopMain { font-size:clamp(30px, 5.5vw, 64px); font-weight:800; letter-spacing:.08em; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.85), 0 0 24px rgba(0,0,0,.6); }
  #telopSub { font-size:clamp(17px, 2.6vw, 30px); font-weight:600; margin-top:8px; color:#ffe2b0; letter-spacing:.05em;
    text-shadow:0 2px 5px rgba(0,0,0,.85), 0 0 18px rgba(0,0,0,.6); }
  body.render .panel, body.render #tour { display:none; }
  body.render #caption { left:50%; right:auto; transform:translateX(-50%); width:min(760px, calc(100% - 32px)); max-width:none; }
  body.intro .panel, body.intro #tour, body.intro #caption, body.intro #chart { opacity:0; pointer-events:none; transition:opacity .6s; }
  .note { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5; }
  @media (max-width:600px) { .panel { top:auto; bottom:16px; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="charts"></div>
<div id="chart" hidden></div>
<div id="sceneCard" hidden></div>
<div id="telop"><div id="telopMain"></div><div id="telopSub"></div></div>
<div id="caption" hidden><div class="cap-head"><span id="capPart"></span><span id="capTitle"></span></div><div id="capText"></div></div>
<div id="tour" hidden>
  <button id="tIntro" title="日本全体から地域へ">🗾</button><button id="tPrev" title="前へ">⏮</button><button id="tPlay" title="再生">▶</button><button id="tNext" title="次へ">⏭</button><button id="tStop" title="終了">■</button>
  <span id="tPos"></span>
</div>
<div class="panel">
  <div style="margin-bottom:8px"><a style="color:#b8dcff" href="?code=01227">歌志内市</a> ／ <a style="color:#b8dcff" href="?code=05327">上小阿仁村</a></div>
  <h1 id="title">地形</h1>
  <div class="sub" id="sub"></div>
  <div class="row"><div class="label"><span>高さの強調</span><span id="exVal"></span></div>
    <input type="range" id="ex" min="1" max="5" step="0.5" value="1.5"></div>
  <div class="row"><div class="label"><span>見る角度（傾き）</span><span id="pitchVal"></span></div>
    <input type="range" id="pitch" min="0" max="85" step="1"></div>
  <div class="row"><div class="label"><span>方角</span><span id="bearingVal"></span></div>
    <input type="range" id="bearing" min="-180" max="180" step="1"></div>
  <div class="row"><div class="label"><span>ズーム</span><span id="zoomVal"></span></div>
    <input type="range" id="zoom" min="8" max="15" step="0.05"></div>
  <label class="cb"><input type="checkbox" id="popColor" checked>字を人口で塗る</label>
  <div class="row" style="margin-top:4px"><div class="label"><span>国勢調査の年</span><span id="yearVal"></span></div>
    <input type="range" id="year" min="2000" max="2020" step="5" value="2020"></div>
  <div class="legend" id="legend"></div>
  <label class="cb"><input type="checkbox" id="pyr">男女・年齢別のグラフ<span class="key"><i style="background:#5aa0f0"></i>男 <i style="background:#f08ca0"></i>女</span></label>
  <div class="row" style="margin-top:6px"><div class="label"><span>グラフ</span></div>
    <select id="chartSel" style="width:100%;background:#1d232c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px">
      <option value="">表示しない</option><option value="longrun">人口の推移（1920〜2020年）</option>
      <option value="industry">産業別の就業者（全体）</option><option value="industryAza">産業別の就業者（字ごと）</option></select></div>
  <label class="cb"><input type="checkbox" id="roads" checked>道路<span class="key"><i style="background:#f07828"></i>高速 <i style="background:#e0463c"></i>国道 <i style="background:#f5c84a"></i><span id="prefRoad">都道府県道</span> <i style="background:#c8c8c8"></i>市町村道</span></label>
  <label class="cb"><input type="checkbox" id="rail" checked>鉄道<span class="key"><i class="rail"></i>JR</span></label>
  <label class="cb"><input type="checkbox" id="water" checked>川・湖<span class="key"><i style="background:#3c8ce6"></i></span></label>
  <label class="cb"><input type="checkbox" id="lblMuni" checked>市町村名</label>
  <label class="cb"><input type="checkbox" id="lblSmall" checked>字名</label>
  <div class="note">標高：<span id="src"></span>。<br>
    境界：市町村 N03（2020）、字 国勢調査小地域（2020）。人口：国勢調査（2000〜2020年）。<br>
    道路 N13（2024、点線＝トンネル）、鉄道 N02（2025）、河川 W05・湖沼 W09（国土数値情報）。<br>ドラッグで移動。角度・方角・ズームはスライダーでも変えられます。</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const code = params.get('code') || '01227';
const C = deck.COORDINATE_SYSTEM.METER_OFFSETS;
const state = { opOut: 0.2, opIn: 0.8, ex: 1.5, popColor: true, year: 2020, pyr: false, chart: '', lblMuni: true, lblSmall: true, roads: true, rail: true, water: true };
let D, origin, mesh, kx, ky, HOME;

const toXY = (lon, lat) => [(lon - origin[0]) * kx, (lat - origin[1]) * ky];

function zAt(lon, lat) {  // bilinear on the terrain grid, ignoring empty nodes
  const g = D.grid, fx = (lon - g.lon0) / g.dlon, fy = (lat - g.lat0) / g.dlat;
  const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
  let s = 0, w = 0;
  for (const [dx, dy, ww] of [[0,0,(1-tx)*(1-ty)],[1,0,tx*(1-ty)],[0,1,(1-tx)*ty],[1,1,tx*ty]]) {
    const x = x0 + dx, y = y0 + dy;
    if (x < 0 || y < 0 || x >= g.nx || y >= g.ny) continue;
    const v = g.z[y * g.nx + x];
    if (!Number.isNaN(v)) { s += v * (ww + 1e-6); w += ww + 1e-6; }
  }
  return w ? s / w : 0;
}

let indices = null, idxIn = null, idxAza = null;
// 2020 population classes for the small areas (sequential greens; 0 people keeps the bare terrain colour)
const POP = [[0, [196, 190, 178], '0人'], [1, [204, 234, 196], '1〜'], [200, [128, 200, 128], '200〜'],
  [400, [46, 150, 82], '400〜'], [800, [10, 92, 52], '800人〜']];
const popOf = s => s && (s.pops ? s.pops[state.year] : s.pop);
const popColor = p => p == null ? [196, 190, 178] : [...POP].reverse().find(([lo]) => p >= lo)[1];
function buildMesh(ex) {
  const g = D.grid, n = g.nx * g.ny, Zs = g.z, W = g.nx;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), tex = new Float32Array(n * 2);
  const dxm = g.dlon * kx, dym = g.dlat * ky, ox = (g.lon0 - origin[0]) * kx, oy = (g.lat0 - origin[1]) * ky;
  const Z = (k, z) => { const v = Zs[k]; return Number.isNaN(v) ? z : v * ex; };
  for (let y = 0; y < g.ny; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, z = Z(i, 0);
    pos[i * 3] = ox + x * dxm; pos[i * 3 + 1] = oy + y * dym; pos[i * 3 + 2] = z;
    const zl = Z(x > 0 ? i - 1 : i, z), zr = Z(x < W - 1 ? i + 1 : i, z);
    const zd = Z(y > 0 ? i - W : i, z), zu = Z(y < g.ny - 1 ? i + W : i, z);
    const nx = -(zr - zl) / (2 * dxm), ny = -(zu - zd) / (2 * dym), l = Math.hypot(nx, ny, 1);
    nor[i * 3] = nx / l; nor[i * 3 + 1] = ny / l; nor[i * 3 + 2] = 1 / l;
  }
  if (!indices) {  // same topology for every exaggeration
    // split the cells: target municipality (mask) vs. the neighbours
    const N = (g.nx - 1) * (g.ny - 1) * 6, out = new Uint32Array(N), inn = new Uint32Array(N); let m = 0, q = 0;
    const ok = k => !Number.isNaN(Zs[k]), M = g.mask;
    for (let y = 0; y < g.ny - 1; y++) for (let x = 0; x < W - 1; x++) {
      const a = y * W + x, b = a + 1, c = a + W, d = c + 1;
      if (!(ok(a) && ok(b) && ok(c) && ok(d))) continue;
      const arr = M && M[a] + M[b] + M[c] + M[d] >= 2 ? inn : out, k = arr === inn ? q : m;
      arr[k] = a; arr[k + 1] = b; arr[k + 2] = d; arr[k + 3] = a; arr[k + 4] = d; arr[k + 5] = c;
      if (arr === inn) q += 6; else m += 6;
    }
    indices = out.slice(0, m); idxIn = inn.slice(0, q);
    const A = g.aza;  // split the target cells once more, by small area (most common non-zero corner)
    if (A) {
      const buf = D.small.map(() => []);
      for (let t = 0; t < idxIn.length; t += 6) {
        const cnt = {}; let best = 0, bn = 0;
        for (const v of [idxIn[t], idxIn[t + 1], idxIn[t + 2], idxIn[t + 5]]) {
          const a = A[v]; if (!a) continue; cnt[a] = (cnt[a] || 0) + 1; if (cnt[a] > bn) { bn = cnt[a]; best = a; }
        }
        if (best) for (let j = 0; j < 6; j++) buf[best - 1].push(idxIn[t + j]);
        else (buf.none ||= []).push(...idxIn.subarray(t, t + 6));
      }
      idxAza = D.small.map((s, i) => ({ s, idx: Uint32Array.from(buf[i]) }));
      if (buf.none) idxAza.push({ s: null, idx: Uint32Array.from(buf.none) });
    }
  }
  const attributes = { positions: { value: pos, size: 3 }, normals: { value: nor, size: 3 }, texCoords: { value: tex, size: 2 } };
  return { out: { attributes, indices: { value: indices, size: 1 } }, in: { attributes, indices: { value: idxIn, size: 1 } },
    aza: idxAza && idxAza.map(({ s, idx }) => ({ s, mesh: { attributes, indices: { value: idx, size: 1 } } })) };
}

const drape = (rings, lift) => rings.map(r => r.map(([lon, lat]) => [...toXY(lon, lat), zAt(lon, lat) * state.ex + lift]));

const ROAD = { 4: [[240, 120, 40], 3.5], 1: [[224, 70, 60], 2.8], 2: [[245, 200, 74], 2], 3: [[200, 200, 200, 210], 1], 7: [[170, 170, 170, 130], 0.6] };
const ORDER = { 7: 0, 3: 1, 2: 2, 1: 3, 4: 4 };
const RIVER_W = { 1: 2.6, 2: 2, 3: 1.5, 4: 0.9, 0: 0.9 };
const dash = new deck.PathStyleExtension({ dash: true });
const lift = (p, h) => p.map(([lon, lat]) => [...toXY(lon, lat), zAt(lon, lat) * state.ex + h]);
let draped = {};
function drapeAll() {  // terrain-following 3D paths, rebuilt only when the exaggeration changes
  draped = {
    roads: [...D.roads].sort((a, b) => ORDER[a.c] - ORDER[b.c]).map(d => ({ ...d, q: lift(d.p, d.c >= 3 ? 4 : 6) })),
    rail: D.rail.map(d => ({ ...d, q: lift(d.p, 7) })),
    rivers: D.rivers.map(d => ({ ...d, q: lift(d.p, 3) })),
    lakes: D.lakes.flatMap(l => l.rings.map(r => {
      const z = Math.min(...r.map(([lon, lat]) => zAt(lon, lat))) * state.ex + 2;
      return { n: l.n, q: r.map(([lon, lat]) => [...toXY(lon, lat), z]) };
    })),
  };
}

function overlayLayers() {
  const o = { coordinateSystem: C, coordinateOrigin: [...origin, 0], widthUnits: 'pixels', capRounded: true, jointRounded: true,
    getPath: d => d.q, updateTriggers: { getPath: state.ex } };
  const out = [];
  if (state.water) out.push(
    new deck.SolidPolygonLayer({ id: 'lakes', data: draped.lakes, _full3d: true, coordinateSystem: C, coordinateOrigin: [...origin, 0],
      getPolygon: d => d.q, getFillColor: [60, 140, 230, 200], updateTriggers: { getPolygon: state.ex } }),
    new deck.PathLayer({ id: 'rivers', data: draped.rivers, ...o, getColor: [60, 140, 230], getWidth: d => RIVER_W[d.s] ?? 1 }));
  if (state.roads) out.push(new deck.PathLayer({ id: 'roads', data: draped.roads, ...o,
    getColor: d => ROAD[d.c][0], getWidth: d => ROAD[d.c][1],
    extensions: [dash], getDashArray: d => d.t ? [2, 2] : [0, 0], dashJustified: true }));
  if (state.rail) out.push(
    new deck.PathLayer({ id: 'rail-base', data: draped.rail, ...o, getColor: [245, 245, 245], getWidth: 4.5 }),
    new deck.PathLayer({ id: 'rail-dash', data: draped.rail, ...o, getColor: [25, 25, 25], getWidth: 2.4,
      extensions: [dash], getDashArray: [3, 3] }));
  return out;
}

function layers() {
  const meshProps = { getPosition: [0, 0, 0], coordinateSystem: C, coordinateOrigin: [...origin, 0], getColor: [196, 190, 178],
    material: { ambient: 0.35, diffuse: 0.75, shininess: 8, specularColor: [30, 30, 30] }, updateTriggers: { mesh: state.ex } };
  const munis = D.munis.flatMap(m => m.rings.map(r => ({ m, r })));
  const small = D.small.flatMap(s => s.rings.map(r => ({ s, r })));
  const out = [
    // neighbours: 80 % transparent and no depth writes, so every line and label shows through
    new deck.SimpleMeshLayer({ id: 'terrain-out', data: [0], mesh: mesh.out, ...meshProps, opacity: state.opOut,
      parameters: { depthWriteEnabled: false } }),
    // target: 20 % transparent, keeps depth so its own ridges still hide what is behind them
    ...(state.popColor && mesh.aza
      ? mesh.aza.map(({ s, mesh: m }, i) => new deck.SimpleMeshLayer({ id: `terrain-aza-${i}`, data: [0], mesh: m, ...meshProps,
          getColor: popColor(popOf(s)), opacity: state.opIn }))
      : [new deck.SimpleMeshLayer({ id: 'terrain-in', data: [0], mesh: mesh.in, ...meshProps, opacity: state.opIn })]),
    ...overlayLayers(),
    new deck.PathLayer({ id: 'small', data: small, coordinateSystem: C, coordinateOrigin: [...origin, 0],
      getPath: d => drape([d.r], 8)[0], getColor: [200, 110, 255, 235], getWidth: 1.4, widthUnits: 'pixels',
      updateTriggers: { getPath: state.ex } }),
    ...(state.focus ? [new deck.PathLayer({ id: 'focus', data: D.small.filter(s => state.focus.includes(s.name)).flatMap(s => s.rings),
      coordinateSystem: C, coordinateOrigin: [...origin, 0], getPath: r => drape([r], 10)[0], getColor: [255, 225, 110],
      getWidth: 4.5, widthUnits: 'pixels', capRounded: true, jointRounded: true, updateTriggers: { getPath: state.ex } })] : []),
    new deck.PathLayer({ id: 'muni', data: munis, coordinateSystem: C, coordinateOrigin: [...origin, 0],
      getPath: d => drape([d.r], 12)[0], getColor: d => d.m.target ? [255, 255, 255] : [150, 158, 172],
      getWidth: d => d.m.target ? 3 : 2.2, widthUnits: 'pixels', updateTriggers: { getPath: state.ex } }),
  ];
  const text = (id, data, size, color) => new deck.TextLayer({ id, data, coordinateSystem: C, coordinateOrigin: [...origin, 0],
    getPosition: d => [...toXY(...d.label), zAt(...d.label) * state.ex + 120], getText: d => d.name.replace(/^字/, '') + (state.popColor && popOf(d) != null ? `\n${popOf(d).toLocaleString()}人` : ''),
    getSize: size, getColor: color, characterSet: 'auto', fontFamily: 'Hiragino Sans, Noto Sans JP, sans-serif',
    fontWeight: 600, outlineWidth: 3, outlineColor: [14, 17, 22, 220], fontSettings: { sdf: true }, parameters: { depthCompare: 'always' },
    updateTriggers: { getPosition: state.ex, getText: [state.popColor, state.year] } });
  if (state.lblMuni) out.push(text('lbl-muni', D.munis, d => d.target ? 18 : 15, [255, 255, 255]));
  if (state.lblSmall) out.push(text('lbl-small', D.small, 12, [220, 175, 255]));
  return out;
}

const lighting = new deck.LightingEffect({
  ambient: new deck.AmbientLight({ color: [255, 255, 255], intensity: 0.8 }),
  sun: new deck.DirectionalLight({ color: [255, 248, 235], intensity: 1.8, direction: [1, 1.2, -0.8] }),
});
let view = { longitude: 142, latitude: 43.4, zoom: 9.6, pitch: 55, bearing: -20, maxPitch: 85, minZoom: 8, maxZoom: 15 };
const DIRS = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
function syncView() {  // panel sliders follow the view, whatever moved it
  for (const k of ['pitch', 'bearing', 'zoom']) document.getElementById(k).value = view[k];

  const img = await createImageBitmap(await r.blob());
  const c = new OffscreenCanvas(img.width, img.height), g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
  for (let i = 0; i < px.length; i += 4) {

    setView({ longitude: L('longitude'), latitude: L('latitude'), zoom: L('zoom'), pitch: L('pitch'), bearing: from.bearing + db * e });
    if (t < 1) camAnim = requestAnimationFrame(tick);
  };
  camAnim = requestAnimationFrame(tick);
}
const sentences = t => t.match(/[^。]+。?/g) || [t];

// Scene-local keyframes and concise overlays, shared by live playback and frame rendering.
function sceneAt(st, elapsed, duration) {
  const t = Math.max(0, Math.min(st.duration, elapsed * st.duration / duration));
  const K = st.camera; let i = 0;
  while (i + 1 < K.length && K[i + 1].t <= t) i++;
  const a = viewFor(K[i], st.focus || []), b = viewFor(K[Math.min(i + 1, K.length - 1)], st.focus || []);
  const span = (K[i + 1]?.t ?? K[i].t) - K[i].t;
  const u = span > 0 ? Math.min(1, (t - K[i].t) / span) : 0;
  const e = u < .5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
  const v = {}; for (const k of ['longitude', 'latitude', 'zoom', 'pitch', 'bearing']) v[k] = a[k] + (b[k] - a[k]) * e;
  setView(v);
  const c = st.captions.find(c => t >= c.t0 && t < c.t1);
  capEl.hidden = !c;
  document.getElementById('capPart').textContent = st.part || '';
  document.getElementById('capTitle').textContent = c?.text || '';
  document.getElementById('capText').textContent = c?.sub || '';
  const card = st.cards.find(c => t >= c.t0 && t < c.t1), el = document.getElementById('sceneCard');
  const key = JSON.stringify(card || null);
  if (el.dataset.key !== key) {
    el.dataset.key = key; el.replaceChildren(); el.hidden = !card;
    if (card) {
      const h = document.createElement('h2'); h.textContent = card.title; el.append(h);
      for (const row of card.rows) { const p = document.createElement('p'); p.textContent = row; el.append(p); }
      const note = document.createElement('small'); note.textContent = card.source || ''; el.append(note);
    }
  }
  if (st.yearAnim) {
    const [y0, y1] = st.yearAnim;
    const y = Math.min(y1, y0 + 5 * Math.floor(t / st.duration * ((y1 - y0) / 5 + 1)));
    if (state.year !== y) applyState({ year: y });
  }
}

// ---- frame-by-frame tour for video (scripts/render_tour.mjs). Same timing as playing live with audio:
// camera flies 2.2 s from the step start, narration starts at +1.2 s, the next step 0.9 s after it ends.
const FLY = 2200, SAY = 1200, GAP = 900, END = 2500;
let TR = null;
window.tourRender = {
  setup(durs) {  // durs: narration length of each step in seconds
    const S = [], A = []; let t = 0;
    TOUR.steps.forEach((st, i) => { S.push(t); A.push(t + SAY); t += SAY + durs[i] * 1000 + GAP; });
    TR = { S, A, durs, total: t - GAP + END, cur: -1 };
    document.body.classList.add('render'); panelEl.classList.add('dim'); capEl.hidden = false;
    map.setProps({ controller: false });
    return { total: TR.total, audioAt: A };
  },
  at(ms) {
    const st = TOUR.steps, S = TR.S;
    let i = 0; while (i + 1 < st.length && S[i + 1] <= ms) i++;
    if (i !== TR.cur) {  // entering a step: its settings, caption and camera path
      TR.cur = i; const s = st[i];
      state.focus = s.focus || null;
      applyState(Object.assign({}, ...st.slice(0, i + 1).map(x => x.set || {})));
      TR.from = i === 0 ? { ...HOME } : (TR.to || { ...HOME });
      TR.to = s.view ? viewFor(s.view, s.focus || []) : { ...TR.from };
      TR.parts = sentences(s.text); TR.cum = TR.parts.reduce((a, p) => [...a, (a.at(-1) || 0) + p.length], []);
      document.getElementById('capPart').textContent = s.part || '';
      document.getElementById('capTitle').textContent = s.title || '';
      document.getElementById('capText').innerHTML = TR.parts.map((p, k) => `<span data-i="${k}">${p}</span>`).join('');
      TR.mark = -2; TR.year = null;
    }
    const s = st[i], f = TR.from, to = TR.to;
    if (TOUR.presentation === 'editorial') {
      const duration = SAY + TR.durs[i] * 1000 + GAP;
      sceneAt(s, ms - S[i], duration);
      return;
    }
    const u = Math.min(1, (ms - S[i]) / FLY), e = u < .5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
    const db = ((to.bearing - f.bearing) % 360 + 540) % 360 - 180, L = k => f[k] + (to[k] - f[k]) * e;
    setView({ longitude: L('longitude'), latitude: L('latitude'), zoom: L('zoom'), pitch: L('pitch'), bearing: f.bearing + db * e });
    if (s.yearAnim) {  // year steps every 2.6 s from the step start, as when playing
      const [y0, y1] = s.yearAnim, y = Math.min(y1, y0 + 5 * Math.floor((ms - S[i]) / 2600));
      if (y !== state.year) applyState({ year: y });
    }
    const a = (ms - TR.A[i]) / (TR.durs[i] * 1000);  // highlight the sentence being read
    const k = a < 0 || a >= 1 ? -1 : TR.cum.findIndex(c => a * TR.cum.at(-1) < c);
    if (k !== TR.mark) { TR.mark = k; document.querySelectorAll('#capText span').forEach(x => x.classList.toggle('now', +x.dataset.i === k)); }
  },
  loaded: () => (map.layerManager?.getLayers() || []).every(l => l.isLoaded),
};
// Silent real-time recording; narration is mixed afterwards on the same timeline.
function initRecordingPlayer() {
  let stream;
  window.player = {
    setup(durations) {
      const info = window.tourRender.setup(durations);
      this.duration = info.total;
      return info;
    },
    async capture({ fps = 60 } = {}) {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: fps, cursor: 'never' }, audio: false,
        preferCurrentTab: true, selfBrowserSurface: 'include',
      });
      return stream.getVideoTracks()[0].getSettings();
    },
    async record({ bitrate = 24e6, sink }) {
      const mimeType = ['video/mp4;codecs=avc1.640033', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']
        .find(m => MediaRecorder.isTypeSupported(m));
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: bitrate });
      let chain = Promise.resolve(), failure = null;
      recorder.ondataavailable = e => {
        if (e.data.size) chain = chain.then(async () => {
          const r = await fetch(sink, { method: 'POST', body: e.data });
          if (!r.ok) throw Error(`recording upload: ${r.status}`);
        }).catch(e => { failure = e; });
      };
      const done = new Promise(resolve => recorder.onstop = resolve);
      const marker = document.createElement('div');
      marker.style.cssText = 'position:fixed;left:0;top:0;width:24px;height:24px;background:#ff00ff;z-index:1000';
      document.body.append(marker); window.tourRender.at(0);
      const started = new Promise(resolve => recorder.onstart = () => resolve(performance.now()));
      recorder.start(1000); const recStart = await started;
      await new Promise(r => setTimeout(r, 300));
      marker.remove(); const start = performance.now();
      await new Promise(resolve => {
        const tick = now => {
          const t = Math.min(this.duration, now - start); window.tourRender.at(t);
          if (t < this.duration) requestAnimationFrame(tick); else resolve();
        };
        requestAnimationFrame(tick);
      });
      const wall = performance.now() - start;
      await new Promise(r => setTimeout(r, 300)); recorder.stop(); await done; await chain;
      stream.getTracks().forEach(t => t.stop());
      if (failure) throw failure;
      return { wall, lead: (start - recStart) / 1000 };
    },
  };
}
let jaVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ja'));
  jaVoice = vs.find(v => /Kyoko|O-ren|Google/.test(v.name)) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// readings for the voice only (captions keep the kanji): longest key first, e.g. 字 -> あざ
const reading = t => Object.entries(TOUR.readings || {}).sort((a, b) => b[0].length - a[0].length)
  .reduce((a, [k, v]) => a.split(k).join(v), t);
let audioEl = null;
function speak(text, id, done, audio) {  // prepared audio file if the step has one, else browser speech per sentence
  const parts = sentences(text);
  if (TOUR.presentation !== 'editorial') document.getElementById('capText').innerHTML = parts.map((p, i) => `<span data-i="${i}">${p}</span>`).join('');
  const mark = i => document.querySelectorAll('#capText span').forEach(s => s.classList.toggle('now', +s.dataset.i === i));
  if (audio) {  // highlight follows playback time, split by sentence length
    const cum = parts.reduce((a, p) => [...a, (a.at(-1) || 0) + p.length], []), tot = cum.at(-1);
    const a = audioEl = new Audio(audio);
    a.ontimeupdate = () => { const f = a.currentTime / (a.duration || 1) * tot; mark(cum.findIndex(c => f < c)); };
    audioEl.onended = () => { if (id === run) { mark(-1); done(); } };
    audioEl.onerror = () => { audioEl = null; if (id === run) speak(text, id, done); };
    audioEl.play().catch(() => audioEl && audioEl.onerror());
    return;
  }
  const say = i => {
    if (id !== run) return;
    if (i >= parts.length) { mark(-1); return done(); }
    mark(i);
    if (!('speechSynthesis' in window)) return setTimeout(() => say(i + 1), 400 + parts[i].length * 140);
    const u = new SpeechSynthesisUtterance(reading(parts[i]));
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = 1.05;
    u.onend = () => say(i + 1); u.onerror = () => setTimeout(() => say(i + 1), 300);
    speechSynthesis.speak(u);
  };
  say(0);
}
function show(i) {
  const st = TOUR.steps[i]; step = i; const id = ++run;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl) { audioEl.pause(); audioEl = null; }
  clearInterval(yearTimer);
  cancelAnimationFrame(camAnim);
  state.focus = st.focus || null;
  // settings accumulate along the script, so jumping to any step gives the same picture as playing to it
  applyState(Object.assign({}, ...TOUR.steps.slice(0, i + 1).map(s => s.set || {})));
  panelEl.classList.add('dim');
  if (st.view && TOUR.presentation !== 'editorial') flyTo(viewFor(st.view, st.focus || []));
  capEl.hidden = false;
  document.getElementById('capPart').textContent = st.part || '';
  document.getElementById('capTitle').textContent = st.title || '';
  document.getElementById('capText').textContent = st.text;
  if (TOUR.presentation === 'editorial') {
    const start = performance.now();
    const tick = () => {
      if (id !== run) return;
      sceneAt(st, playing ? performance.now() - start : Math.min(2200, st.duration), st.duration);
      if (playing) camAnim = requestAnimationFrame(tick);
    };
    tick();
  }
  if (st.yearAnim && playing && TOUR.presentation !== 'editorial') {  // step the census year while the narration runs
    const [y0, y1] = st.yearAnim; let y = y0; applyState({ year: y });
    yearTimer = setInterval(() => { y += 5; if (y > y1) return clearInterval(yearTimer); applyState({ year: y }); }, 2600);
  }
  showPos();
  if (!playing) return;
  setTimeout(() => {
    if (id !== run || !playing) return;
    speak(st.text, id, () => {  // let the camera settle, then read; move on when done
    if (id !== run || !playing) return;
    if (i + 1 < TOUR.steps.length) setTimeout(() => id === run && playing && show(i + 1), 900);
    else stopTour(false);
    }, st.audio);
  }, 1200);
}
function playTour() { playing = true; show(step < 0 ? 0 : step); }
function pauseTour() {
  playing = false; run++; clearInterval(yearTimer);
  cancelAnimationFrame(camAnim);
  if (audioEl) { audioEl.pause(); audioEl = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('#capText span').forEach(s => s.classList.remove('now')); showPos();
}
function stopTour(reset = true) {
  pauseTour(); panelEl.classList.remove('dim'); state.focus = null; redraw(); drawChart();
  if (reset) { step = -1; capEl.hidden = true; document.getElementById('sceneCard').hidden = true; }
  showPos();
}
document.getElementById('tPlay').onclick = () => playing ? pauseTour() : playTour();
document.getElementById('tNext').onclick = () => TOUR && show(Math.min(TOUR.steps.length - 1, step + 1));
document.getElementById('tPrev').onclick = () => TOUR && show(Math.max(0, step - 1));
document.getElementById('tStop').onclick = () => stopTour();
</script>
